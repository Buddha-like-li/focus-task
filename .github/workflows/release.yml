name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-signing-preflight:
    name: Verify tagged release signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4

      - name: Require Tauri signing private key for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must be configured for tagged releases."
            exit 1
          fi

      - name: Validate Chinese release notes before Windows build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash scripts/validate-release-notes.sh "docs/release-notes/${GITHUB_REF_NAME}.md"

  windows-desktop:
    name: Windows desktop build
    needs: release-signing-preflight
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build signed Windows client
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Prepare Windows release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_ASSET="Focus Task_${VERSION}_x64-setup.exe"
          RELEASE_ASSET="Focus.Task_${VERSION}_x64-setup.exe"
          SOURCE_DIR="target/release/bundle/nsis"
          mkdir -p release-artefacts
          for source_path in "$SOURCE_DIR/$SOURCE_ASSET" "$SOURCE_DIR/$SOURCE_ASSET.sig"; do
            if [ ! -s "$source_path" ]; then
              echo "::error::Missing or empty Windows updater asset: $source_path"
              exit 1
            fi
          done
          cp "$SOURCE_DIR/$SOURCE_ASSET" "release-artefacts/$RELEASE_ASSET"
          cp "$SOURCE_DIR/$SOURCE_ASSET.sig" "release-artefacts/$RELEASE_ASSET.sig"

      - name: Upload release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/release-artefacts/*
          generate_release_notes: false
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Write release notes
    needs: windows-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Chinese release notes
        shell: bash
        run: bash scripts/validate-release-notes.sh "docs/release-notes/${GITHUB_REF_NAME}.md"

      - name: Write Chinese Windows client notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="docs/release-notes/${TAG}.md"
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "焦点任务 ${VERSION} 版本更新" \
            --notes-file "$NOTES_FILE"

  updater-manifest:
    name: Publish Windows updater manifest
    needs: [windows-desktop, release-notes]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Validate Chinese release notes
        shell: bash
        run: bash scripts/validate-release-notes.sh "docs/release-notes/${GITHUB_REF_NAME}.md"

      - name: Download Windows signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "Focus.Task_*.exe.sig" --dir sigs --clobber

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="Focus.Task_${VERSION}_x64-setup.exe"
          SIG_FILE="sigs/${ASSET}.sig"
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$SIG_FILE" ]; then
            echo "::error::Missing or empty Windows updater signature: $SIG_FILE"
            exit 1
          fi
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes "$NOTES_FILE" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$SIG_FILE")" \
            --arg url "$BASE_URL/$ASSET" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
